name: gestoria-prod

# gestorIA en producción (ADR 0203): su servidor, en el mismo VPS que las clínicas pero en su
# propio proyecto de OpenShip, con sus contenedores y sus límites. Las clínicas no lo conocen: si
# se cae, ellas siguen. Su base (`gestoria`) vive en el mismo servidor PostgreSQL que la de las
# clínicas, con sus propios usuarios, que no pueden entrar a otra base
# (`gestoria/infra/crear-base.sh`). Su app se publica en Cloudflare Workers desde el CI.
#
# OpenShip aísla la red de cada proyecto: gestorIA llega al PostgreSQL por un enlace de OpenShip
# al servicio `postgres` de las clínicas (modo interno), que lo nombra
# `shared-<id del servicio>` (`docs/deployment.md`). El enlace se arma después de crear los
# contenedores, así que el servidor espera a la base antes de migrar y arrancar.
#
# En OpenShip el proyecto va con `rootDirectory: gestoria` y este archivo como compose: el
# contexto `..` es la raíz del repositorio.
#
# Variables: el entorno del proyecto en OpenShip (`gestoria/infra/prod/.env.example`).

x-runtime-env-file: &runtime-env-file
  - path: ./infra/prod/.env
    required: false

services:
  gestoria-api:
    build:
      context: ..
      dockerfile: gestoria/Dockerfile
    # Migra y arranca. Mientras el enlace a la base no esté listo, la migración reintenta
    # (GESTORIA_DB_WAIT_SECONDS); las migraciones son idempotentes.
    command: ["sh", "-c", "pnpm --filter @gestoria/db migrate && exec pnpm --filter @gestoria/api start"]
    environment:
      GESTORIA_DB_WAIT_SECONDS: "120"
    env_file: *runtime-env-file
    restart: unless-stopped
    # Límites propios: gestorIA no le quita memoria ni CPU a las clínicas.
    mem_limit: 512m
    cpus: 1.0
    expose:
      - "3201"
    ports:
      # Solo en loopback, como vuelta atrás; la entrada pública es el túnel de Cloudflare.
      - "127.0.0.1:3201:3201"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.GESTORIA_PORT||3201)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 150s
