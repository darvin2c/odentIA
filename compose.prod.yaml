name: odentia-prod

# Stack de producción: rutas relativas a este archivo, en la raíz del repo.
# OpenShip aporta el borde HTTPS; las aplicaciones solo publican en loopback.
# Variables: entorno del proyecto en OpenShip o infra/prod/.env para Compose.
# Los servicios con build no declaran image: un refresh reutiliza el artefacto.

x-runtime-env-file: &runtime-env-file
  - path: ./infra/prod/.env
    required: false

services:
  postgres:
    build:
      context: infra/dev/postgres
      args:
        PGMQ_REF: v1.13.0
        PG_CRON_REF: v1.6.8
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_cron"
      - "-c"
      - "cron.database_name=${POSTGRES_DB:-dentalagent}"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dentalagent}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: &app-build
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:?}
        VITE_BASE_DOMAIN: ${VITE_BASE_DOMAIN:?}
    command: ["pnpm", "--filter", "@odentia/db", "migrate"]
    env_file: *runtime-env-file
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: *app-build
    command: ["pnpm", "--filter", "@odentia/api", "start"]
    env_file: *runtime-env-file
    restart: unless-stopped
    ports:
      # Host 3101: el 3001 de loopback lo ocupa el dashboard de OpenShip.
      - "127.0.0.1:3101:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||3001)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build: *app-build
    command: ["pnpm", "--filter", "@odentia/worker", "start"]
    env_file: *runtime-env-file
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  panel:
    build: *app-build
    command: ["pnpm", "--filter", "@odentia/panel", "start"]
    env_file: *runtime-env-file
    environment:
      PORT: "3000"
    restart: unless-stopped
    ports:
      - "127.0.0.1:3010:3000"
    depends_on:
      - api

  platform:
    build: *app-build
    command: ["pnpm", "--filter", "@odentia/platform", "start"]
    env_file: *runtime-env-file
    environment:
      PORT: "3000"
    restart: unless-stopped
    ports:
      - "127.0.0.1:3011:3000"
    depends_on:
      - api

  backup:
    build: infra/prod/backup
    restart: unless-stopped
    env_file: *runtime-env-file
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
