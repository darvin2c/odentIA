name: odentia-prod

# Stack de producción: rutas relativas a este archivo, en la raíz del repo.
# La entrada pública es Cloudflare Tunnel (servicio tunnel); las aplicaciones solo
# publican en loopback, que queda como vuelta atrás por el borde de OpenShip.
# Variables: entorno del proyecto en OpenShip o infra/prod/.env para Compose.
# Los servicios con build no declaran image: un refresh reutiliza el artefacto.

x-runtime-env-file: &runtime-env-file
  - path: ./infra/prod/.env
    required: false

services:
  postgres:
    build:
      context: infra/dev/postgres
      args:
        PGMQ_REF: v1.13.0
        PG_CRON_REF: v1.6.8
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_cron"
      - "-c"
      - "cron.database_name=${POSTGRES_DB:-dentalagent}"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dentalagent}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: &app-build
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:?}
        VITE_BASE_DOMAIN: ${VITE_BASE_DOMAIN:?}
    # Después de migrar carga las listas de diagnósticos oficiales del repositorio
    # (la CIE-11 de la OMS) y la biblioteca de servicios con la lista de cada país
    # (la CPMS del Perú, ADR 0067): sin ella una clínica del Perú no puede crear
    # servicios. Ambas son idempotentes: sin cambios, dejan la base igual (la
    # biblioteca vuelve a escribir los códigos de cada edición en su transacción).
    command: ["sh", "-c", "pnpm --filter @odentia/db migrate && pnpm --filter @odentia/db seed:diagnoses && pnpm --filter @odentia/db seed:procedures"]
    env_file: *runtime-env-file
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: *app-build
    command: ["pnpm", "--filter", "@odentia/api", "start"]
    env_file: *runtime-env-file
    restart: unless-stopped
    ports:
      # Host 3101: el 3001 de loopback lo ocupa el dashboard de OpenShip.
      - "127.0.0.1:3101:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||3001)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build: *app-build
    command: ["pnpm", "--filter", "@odentia/worker", "start"]
    env_file: *runtime-env-file
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  panel:
    build: *app-build
    command: ["pnpm", "--filter", "@odentia/panel", "start"]
    env_file: *runtime-env-file
    environment:
      PORT: "3000"
    restart: unless-stopped
    ports:
      - "127.0.0.1:3010:3000"
    depends_on:
      - api

  admin:
    build: *app-build
    command: ["pnpm", "--filter", "@odentia/admin", "start"]
    env_file: *runtime-env-file
    environment:
      PORT: "3000"
    restart: unless-stopped
    ports:
      - "127.0.0.1:3012:3000"
    depends_on:
      - api

  platform:
    build: *app-build
    command: ["pnpm", "--filter", "@odentia/platform", "start"]
    env_file: *runtime-env-file
    environment:
      PORT: "3000"
    restart: unless-stopped
    ports:
      - "127.0.0.1:3011:3000"
    depends_on:
      - api

  # Web de marketing (ADR 0046): HTML generado al compilar, sin variables de runtime
  # ni dependencias. Solo el Libro de Reclamaciones envía a la API desde el navegador.
  web:
    build: *app-build
    command: ["pnpm", "--filter", "@odentia/web", "start"]
    # La web arma cada página al servirla con los precios de la administración (ADR 0062):
    # los lee de la API por la red del stack, nunca desde fuera.
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      ODENTIA_API_INTERNAL_URL: "http://api:3001"
    restart: unless-stopped
    ports:
      - "127.0.0.1:3013:3000"

  # Entrada pública por Cloudflare Tunnel: cloudflared solo abre conexiones de salida
  # y entrega cada visita por la red del stack (api:3001, panel:3000…), así que nadie
  # llega a odentIA sin pasar por Cloudflare. Rutas y cambio en docs/deployment.md.
  # Sin clave, Compose rechaza el archivo: ponerla antes de desplegar.
  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Falta CLOUDFLARE_TUNNEL_TOKEN (docs/deployment.md)}
    restart: unless-stopped

  backup:
    build: infra/prod/backup
    restart: unless-stopped
    env_file: *runtime-env-file
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
