name: Preview

# Entorno OpenShip por PR, separado de CI: un fallo del preview (disco del
# servidor, DNS, OpenShip) queda en este workflow y no en la verificación del
# código. La fusión depende de `check` (ci.yml), no del preview.
on:
  pull_request:
    # `closed` retira el preview del PR.
    types: [opened, synchronize, reopened, closed]

concurrency:
  # Una cola por PR. Al fusionar, el evento `closed` llega con `github.ref` de la
  # rama base: con una cola por ref, la retirada esperaba detrás de otros eventos
  # y GitHub la cancelaba si otra fusión entraba en la cola.
  group: preview-${{ github.event.pull_request.number }}
  # Un push nuevo reemplaza el despliegue en curso; la retirada nunca se cancela.
  cancel-in-progress: ${{ github.event.action != 'closed' }}

jobs:
  # Un entorno OpenShip por PR del mismo repositorio, en paralelo con `check`.
  # Los forks no reciben secretos y no pueden desplegar.
  preview:
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: write
    env:
      OPENSHIP_URL: ${{ vars.OPENSHIP_URL }}
      OPENSHIP_PROJECT_ID: ${{ vars.OPENSHIP_PROJECT_ID }}
      OPENSHIP_PREVIEW_DOMAIN: ${{ vars.OPENSHIP_PREVIEW_DOMAIN }}
      OPENSHIP_PREVIEW_TOKEN: ${{ secrets.OPENSHIP_PREVIEW_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Instalar CLI oficial de OpenShip
        run: npm install --global openship@0.8.1
      # `login` valida listando tokens, operación que un token scoped no tiene;
      # el primer comando del script comprueba el acceso real.
      - name: Conectar con OpenShip
        run: openship context add ci --api-url "$OPENSHIP_URL/api/proxy" --dashboard-url "$OPENSHIP_URL" --token "$OPENSHIP_PREVIEW_TOKEN" --use
      - name: Crear o actualizar el preview
        id: preview
        run: >-
          node scripts/preview-environment.mjs up
          --pr "${{ github.event.pull_request.number }}"
          --branch "${{ github.event.pull_request.head.ref }}"
          --commit "${{ github.event.pull_request.head.sha }}"
      - name: Publicar la URL en el PR
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          body="<!-- odentia-preview -->
          **Preview:** $PREVIEW_URL
          Commit: \`$HEAD_SHA\` · datos demo (\`ana@odentia.dev\` / \`Demo1234\`); canales mock y LLM fake."
          comment=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- odentia-preview -->"))][0].id // empty')
          if [ -n "$comment" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment" -f body="$body" >/dev/null
          else
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi

  preview-teardown:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENSHIP_URL: ${{ vars.OPENSHIP_URL }}
      OPENSHIP_PROJECT_ID: ${{ vars.OPENSHIP_PROJECT_ID }}
      OPENSHIP_PREVIEW_TOKEN: ${{ secrets.OPENSHIP_PREVIEW_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Instalar CLI oficial de OpenShip
        run: npm install --global openship@0.8.1
      - name: Conectar con OpenShip
        run: openship context add ci --api-url "$OPENSHIP_URL/api/proxy" --dashboard-url "$OPENSHIP_URL" --token "$OPENSHIP_PREVIEW_TOKEN" --use
      - name: Retirar el preview y sus volúmenes
        run: node scripts/preview-environment.mjs down --pr "${{ github.event.pull_request.number }}"
