name: CI

on:
  pull_request:
  push:
    branches: [main]

# El preview de cada PR vive en preview.yml: su fallo (servidor, DNS, OpenShip)
# no debe pintar de rojo la verificación del código.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # No cancelar un deploy productivo.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Preparar PostgreSQL para las pruebas de integración
        run: docker build --tag dentalagent-postgres:18.6 ./infra/dev/postgres
      # Tests unitarios y de integración; los recorridos E2E se ejecutan por separado.
      - run: pnpm test --filter=!@odentia/e2e

  docker-build:
    # Solo antes de desplegar producción. En un PR la imagen ya la construye
    # el preview en OpenShip; repetirlo aquí solo retrasaba ese despliegue.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Verifica que la imagen de producción construye (sin push; el build real
      # lo ejecuta OpenShip en el servidor al desplegar).
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            VITE_API_URL=https://api.example.invalid
            VITE_BASE_DOMAIN=example.invalid
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, docker-build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENSHIP_URL: ${{ vars.OPENSHIP_URL }}
      OPENSHIP_PROJECT_ID: ${{ vars.OPENSHIP_PROJECT_ID }}
      OPENSHIP_DEPLOY_TOKEN: ${{ secrets.OPENSHIP_DEPLOY_TOKEN }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Instalar CLI oficial de OpenShip
        run: npm install --global openship@0.8.1
      - name: Conectar con OpenShip
        run: openship login --api-url "$OPENSHIP_URL/api/proxy" --dashboard-url "$OPENSHIP_URL" --token "$OPENSHIP_DEPLOY_TOKEN"
      - name: Desplegar el commit verificado
        run: openship deploy --project "$OPENSHIP_PROJECT_ID" --branch main --commit "$GITHUB_SHA" --env production --smart-route --watch --timeout 1200000
