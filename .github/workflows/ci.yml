name: CI

on:
  pull_request:
  push:
    branches: [main]

# Las pruebas de cada push a main corren en su propio grupo y no esperan al
# deploy del commit anterior (antes un merge seguido de otro sumaba ~18 min de
# cola). La cola está solo en el job `deploy`.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decide qué corre este cambio (scripts/ci-alcance.mjs): solo documentación no corre
  # nada; un cambio de un paquete corre lo que depende de él; un archivo fuera de
  # apps/, packages/ y e2e/ (CI, Dockerfile, infra, raíz) corre todo. Los demás jobs leen
  # sus salidas. Si no se puede calcular, corre todo: falla hacia lo seguro.
  alcance:
    runs-on: ubuntu-latest
    outputs:
      solo_docs: ${{ steps.calcular.outputs.solo_docs }}
      afectados: ${{ steps.calcular.outputs.afectados }}
      hay_check: ${{ steps.calcular.outputs.hay_check }}
      check: ${{ steps.calcular.outputs.check }}
      e2e: ${{ steps.calcular.outputs.e2e }}
      vps: ${{ steps.calcular.outputs.vps }}
      cloudflare: ${{ steps.calcular.outputs.cloudflare }}
      arquitectura: ${{ steps.calcular.outputs.arquitectura }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Calcular qué corre
        id: calcular
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          npm install --global turbo@2.10.12
          node scripts/ci-alcance.mjs

  # Un push a main que trae exactamente el código que ya pasó todo en su PR (main no
  # avanzó entre la prueba y la unión) no se vuelve a probar: despliega directo. El PR
  # deja anotado el árbol probado en el estado `ci/codigo-probado` de su último commit
  # (job `codigo-probado`); si no coincide, o no se puede saber, se prueba lo afectado.
  ya-probado:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    outputs:
      probado: ${{ steps.comparar.outputs.probado }}
    steps:
      - name: Comparar con lo probado en el PR
        id: comparar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          arbol=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq .tree.sha)
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].number // empty' || true)
          if [ -z "$pr" ]; then
            echo "Sin PR asociado: se prueba lo afectado."
            exit 0
          fi
          cabeza=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq .head.sha)
          probado=$(gh api "repos/$GITHUB_REPOSITORY/commits/$cabeza/statuses"             --jq '[.[] | select(.context == "ci/codigo-probado")][0] | select(.state == "success") | .description // empty' || true)
          if [ "$probado" = "$arbol" ]; then
            echo "El PR #$pr probó este mismo código ($arbol): se despliega sin repetir las pruebas."
            echo "probado=true" >> "$GITHUB_OUTPUT"
          else
            echo "El PR #$pr probó ${probado:-nada anotado} y main tiene $arbol: se prueba lo afectado."
          fi

  # Reglas que leen el repositorio entero (límites entre productos, rutas de la ayuda,
  # pantallas con ScrollArea). Corren en cada cambio de código, no solo cuando cambia su
  # paquete: un cambio en una app puede romper una regla que vive en otro paquete.
  # Son pruebas puras, sin base de datos.
  arquitectura:
    name: arquitectura
    needs: alcance
    if: ${{ !cancelled() && needs.alcance.result == 'success' && needs.alcance.outputs.arquitectura == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reglas de límites y de pantalla
        run: |
          pnpm --filter @odentia/dental exec vitest run src/boundaries.test.ts
          pnpm --filter @odentia/medical exec vitest run src/boundaries.test.ts
          pnpm --filter @odentia/services exec vitest run src/help-guide.test.ts
          pnpm --filter @odentia/ui-patterns exec vitest run src/scroll-policy.test.ts

  # Tipos y pruebas de los paquetes afectados, repartidos en partes paralelas. La lista
  # de partes sale de `alcance`: una parte sin paquetes afectados no se ejecuta. Cada
  # archivo de prueba arranca su propio PostgreSQL con testcontainers, así que cada parte
  # es independiente. Un paquete nuevo cae en la parte general salvo que se le asigne otra.
  check:
    name: check (${{ matrix.parte }})
    needs: [alcance, ya-probado]
    if: ${{ !cancelled() && needs.alcance.result == 'success' && needs.alcance.outputs.hay_check == 'true' && needs.ya-probado.outputs.probado != 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.alcance.outputs.check) }}
    steps:
      - uses: actions/checkout@v4
      # La imagen de PostgreSQL (con pgmq, pg_cron y pgvector compilados) sale de la caché
      # de capas de GitHub: se compila solo cuando cambia su Dockerfile.
      - if: matrix.postgres
        uses: docker/setup-buildx-action@v3
      - name: Preparar PostgreSQL para las pruebas de integración
        if: matrix.postgres
        uses: docker/build-push-action@v6
        with:
          context: ./infra/dev/postgres
          load: true
          tags: dentalagent-postgres:18.6
          cache-from: type=gha,scope=postgres
          cache-to: type=gha,mode=max,scope=postgres
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Los tipos de lo afectado: un cambio puede romper a quien depende de él.
      - if: matrix.tipos != ''
        run: pnpm exec turbo run typecheck ${{ matrix.tipos }}
      - if: matrix.pruebas != ''
        run: pnpm exec turbo run test ${{ matrix.pruebas }} ${{ matrix.opciones }}

  # Recorridos E2E con el supervisor de `e2e/run.ts`: cada parte levanta su
  # propio entorno efímero (PostgreSQL, RustFS, Mailpit, proxy y builds) y corre
  # un tercio de los casos. Modelo falso y sin credenciales de proveedores: no
  # acredita integraciones reales. Sin reintentos (e2e/AGENTS.md). Solo corren si
  # el cambio toca algo que no sea la web de marketing.
  e2e:
    name: e2e (${{ matrix.parte }}/3)
    needs: [alcance, ya-probado]
    if: ${{ !cancelled() && needs.alcance.result == 'success' && needs.alcance.outputs.e2e == 'true' && needs.ya-probado.outputs.probado != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        parte: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Preparar PostgreSQL de las pruebas
        uses: docker/build-push-action@v6
        with:
          context: ./infra/dev/postgres
          load: true
          tags: dentalagent-postgres:18.6
          cache-from: type=gha,scope=postgres
          cache-to: type=gha,mode=max,scope=postgres
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Los binarios de Chromium se bajan una vez por versión de Playwright (lockfile).
      # `--with-deps` sigue instalando paquetes del sistema en cada corrida.
      - name: Caché de Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Instalar Chromium
        run: pnpm --filter @odentia/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e --shard=${{ matrix.parte }}/3 --workers=2
      # Las trazas pueden llevar credenciales de prueba: solo como artefacto
      # privado del repo y por poco tiempo.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.parte }}
          path: e2e/test-results/
          retention-days: 7

  # Solo si cambia lo que va al VPS (api y worker, y lo que dependen de ellos): la imagen
  # de producción sirve esos dos servicios. Las pantallas no están en esa imagen.
  docker-build:
    # También en cada PR: es lo único que comprueba la imagen antes de fusionar,
    # y una imagen rota en main detiene el deploy de producción.
    needs: [alcance, ya-probado]
    if: ${{ !cancelled() && needs.alcance.result == 'success' && needs.alcance.outputs.vps == 'true' && needs.ya-probado.outputs.probado != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Verifica que la imagen de producción construye (sin push; el build real
      # lo ejecuta OpenShip en el servidor al desplegar).
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # Se carga para poder arrancar los servicios en el paso siguiente.
          load: true
          tags: odentia-smoke:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # La imagen se poda de dependencias de desarrollo: comprobar que cada
      # servicio arranca con lo que quedó.
      - name: Arrancar cada servicio de la imagen
        run: |
          docker image ls odentia-smoke:ci --format 'Tamaño de la imagen: {{.Size}}'
          bash scripts/smoke-image.sh odentia-smoke:ci

  deploy:
    # Solo si cambia lo que va al VPS. Con lo probado en el PR, o con todo en verde aquí.
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.alcance.result == 'success' && needs.alcance.outputs.vps == 'true' &&
      (needs.ya-probado.outputs.probado == 'true' ||
      (needs.check.result == 'success' && needs.e2e.result == 'success' && needs.docker-build.result == 'success' && needs.arquitectura.result == 'success')) }}
    needs: [alcance, ya-probado, check, e2e, docker-build, arquitectura]
    runs-on: ubuntu-latest
    # Un deploy que reconstruye los servicios del VPS puede superar los 20 minutos;
    # el CLI espera hasta 40.
    timeout-minutes: 45
    # Un solo deploy a la vez y sin cancelar el que está en curso. Si llegan
    # varios, GitHub descarta los pendientes más viejos y deja el más reciente.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      OPENSHIP_URL: ${{ vars.OPENSHIP_URL }}
      OPENSHIP_PROJECT_ID: ${{ vars.OPENSHIP_PROJECT_ID }}
      OPENSHIP_DEPLOY_TOKEN: ${{ secrets.OPENSHIP_DEPLOY_TOKEN }}
    steps:
      # Las pruebas ya no se serializan: si un commit más viejo termina después
      # de uno más nuevo, desplegarlo devolvería producción atrás. Solo se
      # despliega la punta de main; el commit más nuevo incluye a los anteriores.
      - name: Comprobar que es la punta de main
        id: punta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          punta=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$punta" != "$GITHUB_SHA" ]; then
            echo "main ya avanzó a $punta; la corrida de ese commit desplegará."
            echo "omitir=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.punta.outputs.omitir != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Instalar CLI oficial de OpenShip
        if: steps.punta.outputs.omitir != 'true'
        run: npm install --global openship@0.8.1
      # `login` valida listando tokens, operación que un token scoped no tiene
      # (falla con «Could not validate the token»); `deploy` comprueba el acceso real.
      - name: Conectar con OpenShip
        if: steps.punta.outputs.omitir != 'true'
        run: openship context add ci --api-url "$OPENSHIP_URL/api/proxy" --dashboard-url "$OPENSHIP_URL" --token "$OPENSHIP_DEPLOY_TOKEN" --use
      - name: Desplegar el commit verificado
        if: steps.punta.outputs.omitir != 'true'
        run: openship deploy --project "$OPENSHIP_PROJECT_ID" --branch main --commit "$GITHUB_SHA" --env production --smart-route --watch --timeout 2400000

  # Las webs de marketing (ADR 0136), la administración y el panel (ADR 0137) y la app de las
  # clínicas (ADR 0138) van en Cloudflare Workers, aparte de OpenShip: un cambio llega en unos
  # minutos. En un PR solo se comprueba que se arman para Workers (`--dry-run`, sin claves); en
  # main se publican. Cada app se arma y se publica solo si el cambio la afecta.
  deploy-web:
    if: >-
      ${{ !cancelled() && needs.alcance.result == 'success' && needs.alcance.outputs.cloudflare != '[]' &&
      (needs.ya-probado.outputs.probado == 'true' ||
      ((needs.check.result == 'success' || needs.check.result == 'skipped') &&
      (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') &&
      (needs.arquitectura.result == 'success' || needs.arquitectura.result == 'skipped'))) }}
    needs: [alcance, ya-probado, check, e2e, arquitectura]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: deploy-web-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'production' || github.sha }}
      cancel-in-progress: false
    env:
      WEB_TARGET: cloudflare
      # Publicar solo en la punta de main y con la cuenta de Cloudflare puesta en el repositorio;
      # sin ella, hasta hacer el cambio de `docs/deployment.md`, se comprueba igual que en un PR.
      PUBLICAR: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar que es la punta de main
        if: env.PUBLICAR == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          punta=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$punta" != "$GITHUB_SHA" ]; then
            echo "main ya avanzó a $punta; la corrida de ese commit publicará en Cloudflare."
            echo "OMITIR=true" >> "$GITHUB_ENV"
          fi
      - if: env.OMITIR != 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - if: env.OMITIR != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - if: env.OMITIR != 'true'
        run: pnpm install --frozen-lockfile --filter @odentia/web... --filter @odentia/panel... --filter @odentia/admin... --filter @odentia/dental-clinic... --filter @odentia/medical-clinic...
      # Cada web es un build con su dominio y su producto; las dos usan la misma carpeta, así que
      # se publica una antes de armar la otra. La clave de Cloudflare solo llega al paso que publica.
      - name: Armar la web de odentIA
        if: env.OMITIR != 'true' && contains(fromJSON(needs.alcance.outputs.cloudflare), '@odentia/web')
        working-directory: apps/web
        env:
          VITE_BASE_DOMAIN: odentia32.com
        run: pnpm build && pnpm exec wrangler deploy --dry-run
      - name: Publicar la web de odentIA
        if: env.OMITIR != 'true' && env.PUBLICAR == 'true' && contains(fromJSON(needs.alcance.outputs.cloudflare), '@odentia/web')
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
      - name: Armar la web de latidIA
        if: env.OMITIR != 'true' && contains(fromJSON(needs.alcance.outputs.cloudflare), '@odentia/web')
        working-directory: apps/web
        env:
          VITE_BASE_DOMAIN: latidia72.com
          VITE_PRODUCT: medical
          CLOUDFLARE_ENV: latidia
        run: pnpm build && pnpm exec wrangler deploy --dry-run
      - name: Publicar la web de latidIA
        if: env.OMITIR != 'true' && env.PUBLICAR == 'true' && contains(fromJSON(needs.alcance.outputs.cloudflare), '@odentia/web')
        working-directory: apps/web
        env:
          CLOUDFLARE_ENV: latidia
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
      # La administración y el panel (ADR 0137), con los mismos dominios con que se arman en el VPS.
      - name: Armar la administración
        if: env.OMITIR != 'true' && contains(fromJSON(needs.alcance.outputs.cloudflare), '@odentia/admin')
        working-directory: apps/admin
        env:
          VITE_API_URL: https://api.odentia32.com
          VITE_BASE_DOMAIN: odentia32.com
          VITE_DENTAL_DOMAIN: odentia32.com
          VITE_MEDICAL_DOMAIN: latidia72.com
        run: pnpm build && pnpm exec wrangler deploy --dry-run
      - name: Publicar la administración
        if: env.OMITIR != 'true' && env.PUBLICAR == 'true' && contains(fromJSON(needs.alcance.outputs.cloudflare), '@odentia/admin')
        working-directory: apps/admin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
      - name: Armar el panel de odentIA
        if: env.OMITIR != 'true' && contains(fromJSON(needs.alcance.outputs.cloudflare), '@odentia/panel')
        working-directory: apps/panel
        env:
          VITE_API_URL: https://api.odentia32.com
          VITE_BASE_DOMAIN: odentia32.com
          VITE_DENTAL_DOMAIN: odentia32.com
          VITE_MEDICAL_DOMAIN: latidia72.com
        run: pnpm build && pnpm exec wrangler deploy --dry-run
      - name: Publicar el panel de odentIA
        if: env.OMITIR != 'true' && env.PUBLICAR == 'true' && contains(fromJSON(needs.alcance.outputs.cloudflare), '@odentia/panel')
        working-directory: apps/panel
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
      - name: Armar el panel de latidIA
        if: env.OMITIR != 'true' && contains(fromJSON(needs.alcance.outputs.cloudflare), '@odentia/panel')
        working-directory: apps/panel
        env:
          VITE_API_URL: https://api.latidia72.com
          VITE_BASE_DOMAIN: latidia72.com
          VITE_DENTAL_DOMAIN: odentia32.com
          VITE_MEDICAL_DOMAIN: latidia72.com
          VITE_PRODUCT: medical
          CLOUDFLARE_ENV: latidia
        run: pnpm build && pnpm exec wrangler deploy --dry-run
      - name: Publicar el panel de latidIA
        if: env.OMITIR != 'true' && env.PUBLICAR == 'true' && contains(fromJSON(needs.alcance.outputs.cloudflare), '@odentia/panel')
        working-directory: apps/panel
        env:
          CLOUDFLARE_ENV: latidia
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
      # La app de las clínicas (ADR 0138), con los mismos dominios con que se arma en el VPS.
      - name: Armar la app de las clínicas de odentIA
        if: env.OMITIR != 'true' && contains(fromJSON(needs.alcance.outputs.cloudflare), '@odentia/dental-clinic')
        working-directory: apps/dental-clinic
        env:
          VITE_API_URL: https://api.odentia32.com
          VITE_BASE_DOMAIN: odentia32.com
          VITE_DENTAL_DOMAIN: odentia32.com
          VITE_MEDICAL_DOMAIN: latidia72.com
        run: pnpm build && pnpm exec wrangler deploy --dry-run
      - name: Publicar la app de las clínicas de odentIA
        if: env.OMITIR != 'true' && env.PUBLICAR == 'true' && contains(fromJSON(needs.alcance.outputs.cloudflare), '@odentia/dental-clinic')
        working-directory: apps/dental-clinic
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
      - name: Armar la app de las clínicas de latidIA
        if: env.OMITIR != 'true' && contains(fromJSON(needs.alcance.outputs.cloudflare), '@odentia/medical-clinic')
        working-directory: apps/medical-clinic
        env:
          VITE_API_URL: https://api.latidia72.com
          VITE_BASE_DOMAIN: latidia72.com
          VITE_DENTAL_DOMAIN: odentia32.com
          VITE_MEDICAL_DOMAIN: latidia72.com
          VITE_PRODUCT: medical
        run: pnpm build && pnpm exec wrangler deploy --dry-run
      - name: Publicar la app de las clínicas de latidIA
        if: env.OMITIR != 'true' && env.PUBLICAR == 'true' && contains(fromJSON(needs.alcance.outputs.cloudflare), '@odentia/medical-clinic')
        working-directory: apps/medical-clinic
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

  # En un PR con todo en verde, anota el árbol que se probó (la unión del PR con main
  # de ese momento) en su último commit: al unirlo, `ya-probado` lo compara con main.
  # Lo que no aplica al cambio (job saltado) cuenta como correcto; un fallo no. Un PR
  # desde un fork no puede escribirlo, y entonces main prueba lo afectado.
  codigo-probado:
    # Explícito: `ya-probado` no corre en un PR y, sin esto, GitHub salta todo lo que
    # depende de él aunque las pruebas pasen.
    if: >-
      ${{ !cancelled() && github.event_name == 'pull_request' && needs.alcance.result == 'success' &&
      (needs.check.result == 'success' || needs.check.result == 'skipped') &&
      (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') &&
      (needs.docker-build.result == 'success' || needs.docker-build.result == 'skipped') &&
      (needs.arquitectura.result == 'success' || needs.arquitectura.result == 'skipped') &&
      (needs.deploy-web.result == 'success' || needs.deploy-web.result == 'skipped') }}
    needs: [alcance, check, e2e, docker-build, arquitectura, deploy-web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Anotar el código probado
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CABEZA: ${{ github.event.pull_request.head.sha }}
        run: |
          arbol=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq .tree.sha)
          gh api "repos/$GITHUB_REPOSITORY/statuses/$CABEZA" -f state=success             -f context=ci/codigo-probado -f description="$arbol"             -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo "Probado: $arbol"
