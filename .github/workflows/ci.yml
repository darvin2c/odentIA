name: CI

on:
  pull_request:
    # `closed` retira el preview del PR; check y docker-build no corren en ese evento.
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # No cancelar un deploy productivo ni la retirada de un preview.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event.action != 'closed' }}

jobs:
  check:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Preparar PostgreSQL para las pruebas de integración
        run: docker build --tag dentalagent-postgres:18.6 ./infra/dev/postgres
      # Tests unitarios y de integración; los recorridos E2E se ejecutan por separado.
      - run: pnpm test --filter=!@odentia/e2e

  docker-build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Verifica que la imagen de producción construye (sin push; el build real
      # lo ejecuta OpenShip en el servidor al desplegar).
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            VITE_API_URL=https://api.example.invalid
            VITE_BASE_DOMAIN=example.invalid
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, docker-build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENSHIP_URL: ${{ vars.OPENSHIP_URL }}
      OPENSHIP_PROJECT_ID: ${{ vars.OPENSHIP_PROJECT_ID }}
      OPENSHIP_DEPLOY_TOKEN: ${{ secrets.OPENSHIP_DEPLOY_TOKEN }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Instalar CLI oficial de OpenShip
        run: npm install --global openship@0.8.1
      - name: Conectar con OpenShip
        run: openship login --api-url "$OPENSHIP_URL/api/proxy" --dashboard-url "$OPENSHIP_URL" --token "$OPENSHIP_DEPLOY_TOKEN"
      - name: Desplegar el commit verificado
        run: openship deploy --project "$OPENSHIP_PROJECT_ID" --branch main --commit "$GITHUB_SHA" --env production --smart-route --watch --timeout 1200000

  # Un entorno OpenShip por PR del mismo repositorio, solo con el commit verificado.
  # Los forks no reciben secretos y no pueden desplegar.
  preview:
    if: >-
      github.event_name == 'pull_request' && github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: [check, docker-build]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: write
    env:
      OPENSHIP_URL: ${{ vars.OPENSHIP_URL }}
      OPENSHIP_PROJECT_ID: ${{ vars.OPENSHIP_PROJECT_ID }}
      OPENSHIP_PREVIEW_DOMAIN: ${{ vars.OPENSHIP_PREVIEW_DOMAIN }}
      OPENSHIP_PREVIEW_TOKEN: ${{ secrets.OPENSHIP_PREVIEW_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Instalar CLI oficial de OpenShip
        run: npm install --global openship@0.8.1
      # `login` valida listando tokens, operación que un token scoped no tiene;
      # el primer comando del script comprueba el acceso real.
      - name: Conectar con OpenShip
        run: openship context add ci --api-url "$OPENSHIP_URL/api/proxy" --dashboard-url "$OPENSHIP_URL" --token "$OPENSHIP_PREVIEW_TOKEN" --use
      - name: Crear o actualizar el preview
        id: preview
        run: >-
          node scripts/preview-environment.mjs up
          --pr "${{ github.event.pull_request.number }}"
          --branch "${{ github.event.pull_request.head.ref }}"
          --commit "${{ github.event.pull_request.head.sha }}"
      - name: Publicar la URL en el PR
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          body="<!-- odentia-preview -->
          **Preview:** $PREVIEW_URL
          Commit: \`$HEAD_SHA\` · datos demo (\`ana@odentia.dev\` / \`Demo1234\`); canales mock y LLM fake."
          comment=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- odentia-preview -->"))][0].id // empty')
          if [ -n "$comment" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment" -f body="$body" >/dev/null
          else
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi

  preview-teardown:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENSHIP_URL: ${{ vars.OPENSHIP_URL }}
      OPENSHIP_PROJECT_ID: ${{ vars.OPENSHIP_PROJECT_ID }}
      OPENSHIP_PREVIEW_TOKEN: ${{ secrets.OPENSHIP_PREVIEW_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Instalar CLI oficial de OpenShip
        run: npm install --global openship@0.8.1
      - name: Conectar con OpenShip
        run: openship context add ci --api-url "$OPENSHIP_URL/api/proxy" --dashboard-url "$OPENSHIP_URL" --token "$OPENSHIP_PREVIEW_TOKEN" --use
      - name: Retirar el preview y sus volúmenes
        run: node scripts/preview-environment.mjs down --pr "${{ github.event.pull_request.number }}"
