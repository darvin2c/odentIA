name: CI

on:
  pull_request:
  push:
    branches: [main]

# Las pruebas de cada push a main corren en su propio grupo y no esperan al
# deploy del commit anterior (antes un merge seguido de otro sumaba ~18 min de
# cola). La cola está solo en el job `deploy`.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Tests unitarios y de integración repartidos en partes paralelas; los
  # recorridos E2E van en el job `e2e`. Cada archivo de prueba arranca su
  # propio PostgreSQL con testcontainers, así que cada parte es independiente.
  # Un paquete nuevo cae en la parte general salvo que se le asigne otra.
  check:
    name: check (${{ matrix.parte }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Tipos de todo el repo y las pruebas de los paquetes sin parte propia.
          - parte: general
            tipos: true
            postgres: true
            paquetes: --filter=!@odentia/e2e --filter=!@odentia/services --filter=!@odentia/api --filter=!@odentia/ui-patterns --filter=!@odentia/dental-clinic --filter=!@odentia/medical-clinic --filter=!@odentia/clinic-app
          # `--only` omite el `^build` (tsc --noEmit): ya lo comprueba la parte general.
          # Pruebas de interfaz con jsdom: sin base de datos, pero mucha CPU.
          - parte: interfaz
            paquetes: --filter=@odentia/ui-patterns --filter=@odentia/dental-clinic --filter=@odentia/medical-clinic --filter=@odentia/clinic-app
            opciones: --only
          - parte: api
            postgres: true
            paquetes: --filter=@odentia/api
            opciones: --only
          - parte: services-1
            postgres: true
            paquetes: --filter=@odentia/services
            opciones: --only -- --shard=1/3
          - parte: services-2
            postgres: true
            paquetes: --filter=@odentia/services
            opciones: --only -- --shard=2/3
          - parte: services-3
            postgres: true
            paquetes: --filter=@odentia/services
            opciones: --only -- --shard=3/3
    steps:
      - uses: actions/checkout@v4
        with:
          # En un PR, HEAD es la fusión con main y HEAD^1 la punta de main.
          fetch-depth: 2
      # La imagen se construye en segundo plano mientras se instala y se
      # comprueban los tipos; el paso de pruebas la espera.
      - name: Preparar PostgreSQL para las pruebas de integración
        if: matrix.postgres
        run: |
          # Toda la salida al log: el paso no debe quedar atado a la del proceso.
          (set +e
           docker build --tag dentalagent-postgres:18.6 ./infra/dev/postgres
           echo $? > "$RUNNER_TEMP/postgres.exit") > "$RUNNER_TEMP/postgres.log" 2>&1 &
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # En main corre todo. En un PR, solo los paquetes cambiados y los que
      # dependen de ellos, salvo que cambie algo que Turbo no atribuye a ningún
      # paquete pero que afecta a todos: dependencias, configuración, parches,
      # la imagen de PostgreSQL de las pruebas o este mismo workflow.
      - name: Decidir el alcance
        id: alcance
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "Push a main: suite completa."
            exit 0
          fi
          globales=$(git diff --name-only HEAD^1 HEAD | grep -E '^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|\.npmrc|turbo\.json|tsconfig\.base\.json|patches/|infra/dev/postgres/|\.github/workflows/ci\.yml)' || true)
          if [ -n "$globales" ]; then
            echo "Cambian archivos globales; suite completa:"
            echo "$globales"
            exit 0
          fi
          echo "afectados=--affected" >> "$GITHUB_OUTPUT"
          echo "TURBO_SCM_BASE=HEAD^1" >> "$GITHUB_ENV"
      - if: matrix.tipos
        run: pnpm exec turbo run typecheck ${{ steps.alcance.outputs.afectados }}
      - name: Buscar paquetes con pruebas
        id: pruebas
        run: |
          total=$(pnpm exec turbo ls ${{ steps.alcance.outputs.afectados }} ${{ matrix.paquetes }} --output=json | jq '.packages.count')
          echo "Paquetes a probar: $total"
          echo "total=$total" >> "$GITHUB_OUTPUT"
      - name: Esperar la imagen de PostgreSQL
        if: matrix.postgres && steps.pruebas.outputs.total != '0'
        run: |
          timeout 600 sh -c 'while [ ! -f "$RUNNER_TEMP/postgres.exit" ]; do sleep 2; done'
          cat "$RUNNER_TEMP/postgres.log"
          exit "$(cat "$RUNNER_TEMP/postgres.exit")"
      - if: steps.pruebas.outputs.total != '0'
        run: pnpm exec turbo run test ${{ steps.alcance.outputs.afectados }} ${{ matrix.paquetes }} ${{ matrix.opciones }}
      # Una pantalla que cambia no afecta a servicios, pero sí a la guía de Ariadna:
      # sin esto, el PR pasa y la prueba falla recién en main, sin desplegar.
      - name: Comparar la guía de Ariadna con las pantallas
        if: matrix.parte == 'interfaz'
        run: pnpm --filter @odentia/services exec vitest run src/help-guide.test.ts src/medical/help.test.ts

  # Recorridos E2E con el supervisor de `e2e/run.ts`: cada parte levanta su
  # propio entorno efímero (PostgreSQL, RustFS, Mailpit, proxy y builds) y corre
  # un tercio de los casos. Modelo falso y sin credenciales de proveedores: no
  # acredita integraciones reales. Sin reintentos (e2e/AGENTS.md).
  e2e:
    name: e2e (${{ matrix.parte }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        parte: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Preparar PostgreSQL de las pruebas
        run: |
          (set +e
           docker build --tag dentalagent-postgres:18.6 ./infra/dev/postgres
           echo $? > "$RUNNER_TEMP/postgres.exit") > "$RUNNER_TEMP/postgres.log" 2>&1 &
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Instalar Chromium
        run: pnpm --filter @odentia/e2e exec playwright install --with-deps chromium
      - name: Esperar la imagen de PostgreSQL
        run: |
          timeout 600 sh -c 'while [ ! -f "$RUNNER_TEMP/postgres.exit" ]; do sleep 2; done'
          cat "$RUNNER_TEMP/postgres.log"
          exit "$(cat "$RUNNER_TEMP/postgres.exit")"
      - run: pnpm e2e --shard=${{ matrix.parte }}/3 --workers=2
      # Las trazas pueden llevar credenciales de prueba: solo como artefacto
      # privado del repo y por poco tiempo.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.parte }}
          path: e2e/test-results/
          retention-days: 7

  docker-build:
    # También en cada PR: es lo único que comprueba la imagen antes de fusionar,
    # y una imagen rota en main detiene el deploy de producción.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Verifica que la imagen de producción construye (sin push; el build real
      # lo ejecuta OpenShip en el servidor al desplegar).
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # Se carga para poder arrancar los servicios en el paso siguiente.
          load: true
          tags: odentia-smoke:ci
          build-args: |
            VITE_API_URL=https://api.example.invalid
            VITE_BASE_DOMAIN=example.invalid
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # La imagen se poda de dependencias de desarrollo: comprobar que cada
      # servicio arranca con lo que quedó.
      - name: Arrancar cada servicio de la imagen
        run: |
          docker image ls odentia-smoke:ci --format 'Tamaño de la imagen: {{.Size}}'
          bash scripts/smoke-image.sh odentia-smoke:ci

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, e2e, docker-build]
    runs-on: ubuntu-latest
    # Un deploy que reconstruye todos los servicios (admin, panel, platform, web,
    # api, worker) puede superar los 20 minutos; el CLI espera hasta 40.
    timeout-minutes: 45
    # Un solo deploy a la vez y sin cancelar el que está en curso. Si llegan
    # varios, GitHub descarta los pendientes más viejos y deja el más reciente.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      OPENSHIP_URL: ${{ vars.OPENSHIP_URL }}
      OPENSHIP_PROJECT_ID: ${{ vars.OPENSHIP_PROJECT_ID }}
      OPENSHIP_DEPLOY_TOKEN: ${{ secrets.OPENSHIP_DEPLOY_TOKEN }}
    steps:
      # Las pruebas ya no se serializan: si un commit más viejo termina después
      # de uno más nuevo, desplegarlo devolvería producción atrás. Solo se
      # despliega la punta de main; el commit más nuevo incluye a los anteriores.
      - name: Comprobar que es la punta de main
        id: punta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          punta=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$punta" != "$GITHUB_SHA" ]; then
            echo "main ya avanzó a $punta; la corrida de ese commit desplegará."
            echo "omitir=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.punta.outputs.omitir != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Instalar CLI oficial de OpenShip
        if: steps.punta.outputs.omitir != 'true'
        run: npm install --global openship@0.8.1
      # `login` valida listando tokens, operación que un token scoped no tiene
      # (falla con «Could not validate the token»); `deploy` comprueba el acceso real.
      - name: Conectar con OpenShip
        if: steps.punta.outputs.omitir != 'true'
        run: openship context add ci --api-url "$OPENSHIP_URL/api/proxy" --dashboard-url "$OPENSHIP_URL" --token "$OPENSHIP_DEPLOY_TOKEN" --use
      - name: Desplegar el commit verificado
        if: steps.punta.outputs.omitir != 'true'
        run: openship deploy --project "$OPENSHIP_PROJECT_ID" --branch main --commit "$GITHUB_SHA" --env production --smart-route --watch --timeout 2400000
