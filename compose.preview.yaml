name: odentia-preview

# OpenShip asigna un slug, red y volúmenes distintos a cada entorno.
# Solo las superficies HTTP publican puertos aleatorios en loopback.
x-runtime-env-file: &runtime-env-file
  - path: ./infra/preview/.env
    required: false

x-app-build: &app-build
  context: .
  dockerfile: Dockerfile
  args:
    VITE_API_URL: ${VITE_API_URL:?}
    VITE_BASE_DOMAIN: ${VITE_BASE_DOMAIN:?}

services:
  postgres:
    build:
      context: infra/dev/postgres
      args:
        PGMQ_REF: v1.13.0
        PG_CRON_REF: v1.6.8
    restart: unless-stopped
    command: [postgres, -c, shared_preload_libraries=pg_cron, -c, "cron.database_name=${POSTGRES_DB:-dentalagent}"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql
    mem_limit: 512m
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ${POSTGRES_USER:-dentalagent}"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    build: infra/preview/minio
    command: [server, /data, --console-address, ":9001"]
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1::9000"
    mem_limit: 512m
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:9000/minio/health/ready]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    build: infra/preview/minio
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        # OpenShip no garantiza el orden de `depends_on`: este paso puede arrancar
        # antes de que MinIO acepte conexiones. Sin los buckets la semilla falla en
        # su primer adjunto, así que se espera a MinIO en vez de fallar al primer intento.
        attempt=1
        until mc alias set local http://minio:9000 "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}" >/dev/null 2>&1; do
          if [ "$$attempt" -ge 60 ]; then
            echo "MinIO no respondió tras $$attempt intentos; no se crearon los buckets."
            exit 1
          fi
          echo "MinIO aún no responde (intento $$attempt); se reintenta en 2 s."
          attempt=$$((attempt + 1))
          sleep 2
        done
        mc mb --ignore-existing local/avatars
        mc mb --ignore-existing local/attachments
        mc anonymous set download local/avatars/avatars
    mem_limit: 128m

  mailpit:
    image: axllent/mailpit:v1.31.4
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: "200"
    # SMTP y la bandeja HTTP quedan dentro de la red del PR; no hay relay.
    mem_limit: 128m

  migrate:
    build: *app-build
    command: [pnpm, --filter, "@odentia/db", migrate]
    env_file: *runtime-env-file
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    mem_limit: 512m

  seed:
    build: *app-build
    env_file: *runtime-env-file
    # Marcador escrito solo después de completar toda la semilla.
    # Este volumen pertenece al mismo ciclo de vida que pgdata y miniodata.
    volumes:
      - seedstate:/var/lib/odentia-seed
    command:
      - /bin/sh
      - -ec
      - |
        if [ -f /var/lib/odentia-seed/completed ]; then
          echo "Semilla del preview ya inicializada; se conservan los datos."
          exit 0
        fi
        # OpenShip no garantiza el orden de `depends_on`: la semilla puede
        # arrancar antes de que terminen las migraciones (o de que el storage
        # esté enrutado). Los tres pasos son idempotentes, así que se reintenta
        # la secuencia completa hasta un límite en vez de fallar al primer intento.
        attempt=1
        until pnpm --filter @odentia/db seed:cie10 \
          && pnpm --filter @odentia/db seed:procedures \
          && pnpm db:seed; do
          if [ "$$attempt" -ge 60 ]; then
            echo "La semilla del preview no pudo completarse tras $$attempt intentos."
            exit 1
          fi
          echo "Semilla incompleta (intento $$attempt); se reintenta en 10 s."
          attempt=$$((attempt + 1))
          sleep 10
        done
        touch /var/lib/odentia-seed/completed
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    restart: "no"
    mem_limit: 768m

  api:
    build: *app-build
    command: [pnpm, --filter, "@odentia/api", start]
    env_file: *runtime-env-file
    restart: unless-stopped
    ports:
      - "127.0.0.1::3001"
    depends_on:
      seed:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    mem_limit: 768m
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build: *app-build
    command: [pnpm, --filter, "@odentia/worker", start]
    env_file: *runtime-env-file
    restart: unless-stopped
    depends_on:
      seed:
        condition: service_completed_successfully
    mem_limit: 768m

  panel:
    build: *app-build
    command: [pnpm, --filter, "@odentia/panel", start]
    env_file: *runtime-env-file
    environment:
      PORT: "3000"
    restart: unless-stopped
    ports:
      - "127.0.0.1::3000"
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 512m

  admin:
    build: *app-build
    command: [pnpm, --filter, "@odentia/admin", start]
    env_file: *runtime-env-file
    environment:
      PORT: "3000"
    restart: unless-stopped
    ports:
      - "127.0.0.1::3000"
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 512m

  platform:
    build: *app-build
    command: [pnpm, --filter, "@odentia/platform", start]
    env_file: *runtime-env-file
    environment:
      PORT: "3000"
    restart: unless-stopped
    ports:
      - "127.0.0.1::3000"
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 512m

volumes:
  pgdata:
  miniodata:
  seedstate:
