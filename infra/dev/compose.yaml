name: dentalagent-dev

services:
  postgres:
    build:
      context: ./postgres
      args:
        PGMQ_REF: v1.13.0
        PG_CRON_REF: v1.6.8
    image: dentalagent-postgres:18.6
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_cron"
      - "-c"
      - "cron.database_name=${POSTGRES_DB:-dentalagent}"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dentalagent}
      POSTGRES_USER: ${POSTGRES_USER:-dentalagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dentalagent}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-dentalagent_app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dentalagent}"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin} >/dev/null;
      mc mb -p local/$${S3_BUCKET:-dentalagent-dev} 2>/dev/null || true;
      mc mb -p local/$${S3_ATTACHMENTS_BUCKET:-dentalagent-attachments} 2>/dev/null || true;
      mc anonymous set download local/$${S3_BUCKET:-dentalagent-dev}/avatars >/dev/null 2>&1 || true;
      mc version enable local/$${S3_BUCKET:-dentalagent-dev} 2>/dev/null || true;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-dentalagent-dev}
      S3_ATTACHMENTS_BUCKET: ${S3_ATTACHMENTS_BUCKET:-dentalagent-attachments}

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_HTTP_PORT:-8025}:8025"
    volumes:
      - mailpitdata:/data

volumes:
  pgdata:
  miniodata:
  mailpitdata:
