name: dentalagent-dev

services:
  postgres:
    build:
      context: ./postgres
      args:
        PGMQ_REF: v1.13.0
        PG_CRON_REF: v1.6.8
        PGVECTOR_REF: v0.8.1
    image: dentalagent-postgres:18.6
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_cron"
      - "-c"
      - "cron.database_name=${POSTGRES_DB:-dentalagent}"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dentalagent}
      POSTGRES_USER: ${POSTGRES_USER:-dentalagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dentalagent}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-dentalagent_app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dentalagent}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Almacenamiento S3 local (MinIO se archivó en 2026 y ya no publica imagen).
  # Usa las mismas claves que la aplicación (S3_ACCESS_KEY / S3_SECRET_KEY).
  storage:
    image: docker.io/rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "${S3_API_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - storagedata:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Crea los buckets como en producción: privados, `avatars/` público para
  # leer, versiones en el público y en adjuntos el CORS de R2
  # (docs/deployment.md) para los dominios locales `*.localhost`.
  storage-init:
    image: docker.io/amazon/aws-cli:2.37.9
    depends_on:
      storage:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-minioadmin}
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://storage:9000
      S3_BUCKET: ${S3_BUCKET:-dentalagent-dev}
      S3_ATTACHMENTS_BUCKET: ${S3_ATTACHMENTS_BUCKET:-dentalagent-attachments}
    volumes:
      - ./storage-init.sh:/storage-init.sh:ro
    entrypoint: ["/bin/sh", "/storage-init.sh"]

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_HTTP_PORT:-8025}:8025"
    volumes:
      - mailpitdata:/data

volumes:
  pgdata:
  storagedata:
  mailpitdata:
