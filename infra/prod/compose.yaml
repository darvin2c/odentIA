name: odentia-prod

# Stack de aplicación para OpenShip (se despliega "as-is" desde el repo).
# El borde (TLS, dominios, routing) lo gestiona el edge OpenResty de OpenShip;
# por eso no hay Caddy aquí y los servicios web/api publican en loopback para
# que el edge (network_mode: host) les enrute los dominios asignados en la UI.
# Variables en .env (copiar de .env.example).

services:
  postgres:
    build:
      context: ../../infra/dev/postgres
      args:
        PGMQ_REF: v1.13.0
        PG_CRON_REF: v1.6.8
    image: odentia-postgres:18.6
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_cron"
      - "-c"
      - "cron.database_name=${POSTGRES_DB:-dentalagent}"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dentalagent}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: &app-build
      context: ../..
      args:
        VITE_API_URL: ${VITE_API_URL:?}
        VITE_BASE_DOMAIN: ${VITE_BASE_DOMAIN:?}
    image: odentia-app:latest
    command: ["pnpm", "--filter", "@odentia/db", "migrate"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: *app-build
    image: odentia-app:latest
    command: ["pnpm", "--filter", "@odentia/api", "start"]
    env_file: .env
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||3001)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build: *app-build
    image: odentia-app:latest
    command: ["pnpm", "--filter", "@odentia/worker", "start"]
    env_file: .env
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  panel:
    build: *app-build
    image: odentia-app:latest
    command: ["pnpm", "--filter", "@odentia/panel", "start"]
    env_file: .env
    environment:
      PORT: "3000"
    restart: unless-stopped
    ports:
      - "127.0.0.1:3010:3000"
    depends_on:
      - api

  platform:
    build: *app-build
    image: odentia-app:latest
    command: ["pnpm", "--filter", "@odentia/platform", "start"]
    env_file: .env
    environment:
      PORT: "3000"
    restart: unless-stopped
    ports:
      - "127.0.0.1:3011:3000"
    depends_on:
      - api

  backup:
    build: ./backup
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
